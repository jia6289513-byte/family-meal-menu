<section class="hero"><div><div class="eyebrow">A LITTLE INSPIRATION FOR TODAY</div><h1>今天，好好吃一顿。<br><em>吃什么我来安排。</em></h1><p class="sub">荤素搭配，做法视频也放在每道菜的详情里。</p></div><div class="today"><div><div class="today-label">今天的菜单</div><div class="today-date" id="dateText"></div></div><div class="date-actions"><button class="icon-btn" id="prev" aria-label="前一天">‹</button><button class="today-btn" id="todayBtn">回到今天</button><button class="icon-btn" id="next" aria-label="后一天">›</button></div></div></section>
<div class="toolbar"><h2>今日餐桌 <span style="font-size:11px;color:#939b8f;font-weight:500">· 一家人的营养搭配</span></h2><div class="badges"><span class="badge"><b>✓</b>每日一荤一素</span><span class="badge"><b>✓</b>年度不重样</span><span class="badge"><b>✓</b>按口味安排</span></div></div>
<section class="grid" id="menu"></section><div class="note"><span class="note-icon">🌿</span><div><strong>照顾不同口味</strong>　肉菜按全家喜好正常推荐；减脂需求可以选少油做法，并多搭配青菜。</div></div>
<section class="lower"><div class="panel"><div class="panel-head"><h3>接下来几天</h3><button class="panel-link" id="weekLink">看完整周 →</button></div><div class="week" id="week"></div></div><div class="panel streak"><div class="streak-icon">🥬</div><div><h3>清爽一点，也很满足</h3><p>做饭时少放一点油，蔬菜多一点，<br>一家人吃得舒服最重要。</p></div></div></section><div class="footer">全年菜单按年度打散搭配 · 整年每日整套菜单不重复 · 食材用量按人数增减</div></main>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><div><div class="eyebrow" id="mCategory"></div><h2 id="mTitle"></h2></div><button class="close" id="close">×</button></div><div class="modal-meta" id="mMeta"></div><h4>食材准备</h4><div class="ingredients" id="mIngredients"></div><h4>简单做法</h4><ol class="steps" id="mSteps"></ol><div id="videoWrap"></div></div></div><div class="toast" id="toast"></div>
<script>
const proteins=[
['宫保鸡丁','🍗','鸡腿肉、花生米、黄瓜、干辣椒','鸡腿肉切丁，加少许生抽和淀粉抓匀；黄瓜切丁，调好生抽、醋、糖和淀粉汁。','鸡肉炒至变色盛出，炒香干辣椒，放黄瓜和调味汁，倒回鸡肉，出锅前加花生米。',25],['番茄炖牛腩','🥘','牛腩、番茄、洋葱','牛腩切块焯水；番茄切块，洋葱切丝。','少油炒香洋葱和番茄，加牛腩与热水，小火炖 60 分钟。',75],['清蒸鲈鱼','🐟','鲈鱼、姜、葱、蒸鱼豉油','鲈鱼洗净，两面划刀，鱼身和肚中放姜片。','水开上锅蒸 8–10 分钟，倒掉汁水，放葱丝淋少许热油和豉油。',15],['彩椒炒里脊','🥩','猪里脊、彩椒、蒜','里脊切薄片，用少许生抽和淀粉抓匀；彩椒切块。','少油滑炒肉片至变色，加入彩椒炒熟，少量盐调味。',20],['照烧鸡腿排','🍗','去皮鸡腿、酱油、蜂蜜','鸡腿去皮去骨，厨房纸吸干；酱油加少许蜂蜜调汁。','鸡肉煎至两面金黄，加调味汁和少许水，收汁至熟透。',25],['芹菜牛肉丝','🥩','牛肉、芹菜、姜丝','牛肉逆纹切丝，加少许生抽和淀粉腌 10 分钟；芹菜切段。','少油先炒牛肉至八成熟盛出，炒香芹菜，倒回牛肉快速炒匀。',20],['香菇蒸鸡','🍗','鸡腿肉、香菇、姜片','鸡腿肉切块，香菇泡软切片，加入姜和少许生抽拌匀。','水开后上锅蒸 18–20 分钟，出锅撒葱花。',25],['糖醋排骨','🥩','猪肋排、姜、冰糖、醋、生抽','排骨冷水下锅焯去浮沫，捞出洗净；调好糖、醋、生抽和少许老抽。','排骨煎至微黄，加姜片和调味汁及热水，小火焖 35 分钟，开盖收浓汤汁。',50],['青椒炒肉片','🥩','瘦猪肉、青椒、蒜','瘦肉切片，用少许生抽和淀粉抓匀；青椒切块。','少油炒肉片至变色，加入青椒翻炒至断生。',20],['香煎三文鱼','🐟','三文鱼、柠檬、黑胡椒','三文鱼擦干，撒黑胡椒和少量盐静置片刻。','不粘锅少油，中火每面煎 3–4 分钟，配柠檬角。',15],['口蘑滑鸡片','🍗','鸡胸肉、口蘑、蒜','鸡肉切片加淀粉腌制；口蘑切片。','先炒鸡片至变色，加入口蘑炒软，加少许生抽调味。',20],['卤牛腱切片','🥩','牛腱、卤料、姜','牛腱焯水洗净；准备八角、香叶、姜和少许生抽。','加水没过牛腱，小火卤 70–90 分钟，放凉切薄片。',100],['虾仁豆腐煲','🦐','虾仁、嫩豆腐、葱','豆腐切块，虾仁洗净；锅中加少许水和姜丝。','豆腐煮 5 分钟后加虾仁至变色，少量盐调味，撒葱花。',15],['洋葱炒牛肉','🥩','牛肉、洋葱、黑胡椒','牛肉切片加黑胡椒和少许淀粉抓匀，洋葱切丝。','少油快炒牛肉至变色，加入洋葱炒软即可。',20],['家常红烧肉','🥩','五花肉、冰糖、葱姜、八角、生抽','五花肉切块，冷水下锅焯水后捞出；准备葱段、姜片和八角。','锅中放少许油和冰糖炒出糖色，下五花肉翻匀，加葱姜、八角、生抽和热水，小火炖至软烂后收汁。',90],
['黄焖鸡米饭','🍗','鸡腿、香菇、青椒、土豆、生姜','鸡腿切块焯水，香菇泡发，土豆切块，青椒切片。','鸡块煎香后加姜片、生抽、蚝油和热水焖 20 分钟，放土豆和香菇焖熟，最后加青椒收汁。',40],
['鱼香肉丝','🥩','猪里脊、木耳、胡萝卜、泡椒','里脊、木耳和胡萝卜切丝；用生抽、醋、糖和淀粉调鱼香汁。','肉丝滑炒至变色盛出，炒香泡椒和配菜，倒入肉丝与鱼香汁，大火炒匀收汁。',25],
['可乐鸡翅','🍗','鸡翅、可乐、姜、葱、生抽','鸡翅两面划口，擦干水分；姜切片。','鸡翅煎至两面金黄，加姜片、生抽和可乐没过一半，小火焖至熟透，开盖收汁。',35],
['豆豉蒸排骨','🥩','猪肋排、豆豉、蒜、淀粉','排骨泡去血水，沥干后加豆豉、蒜末、生抽和少许淀粉抓匀。','排骨平铺盘中，水开后上锅大火蒸 25–30 分钟，撒葱花。',40],
['土豆炖牛肉','🥘','牛腩、土豆、胡萝卜、洋葱','牛腩切块焯水，土豆和胡萝卜切滚刀块。','牛腩与洋葱、姜片炒香，加热水炖 50 分钟，再放土豆胡萝卜炖软，加盐调味。',75],
['梅菜扣肉','🥩','五花肉、梅干菜、姜、葱','五花肉煮至七成熟，表皮扎孔抹少许老抽；梅干菜泡洗后切碎。','五花肉煎至表皮金黄切片，与炒香的梅干菜码碗，蒸 60 分钟后倒扣。',90],
['农家小炒肉','🥩','猪五花肉、青椒、蒜、豆豉','五花肉切薄片，青椒切滚刀块，蒜切片。','五花肉煸出油至微焦，放蒜和豆豉炒香，下青椒大火炒熟，加少许生抽。',20],
['蒜苔炒肉丝','🥩','猪里脊、蒜苔、红椒','里脊切丝加生抽和淀粉腌 10 分钟，蒜苔切段。','肉丝滑炒变色盛出，蒜苔炒至断生，倒回肉丝和红椒快速翻炒。',20],
['京酱肉丝','🥩','猪里脊、甜面酱、豆腐皮、葱','里脊切丝加淀粉腌制，葱切丝，豆腐皮切方片。','肉丝滑炒至熟，加入甜面酱和少许糖炒匀；用豆腐皮卷肉丝和葱丝吃。',25],
['香辣口水鸡','🍗','鸡腿、花生、葱、蒜、辣椒油','鸡腿冷水下锅加姜葱煮熟，放凉后切块；蒜切末，花生压碎。','生抽、醋、少许糖和辣椒油调汁，淋在鸡块上，撒蒜末、花生和葱花。',40],

const annualMenuCache=new Map();function annualMenus(year){if(annualMenuCache.has(year))return annualMenuCache.get(year);let seed=(year^0x9e3779b9)>>>0;function random(){seed=(seed+0x6D2B79F5)>>>0;let t=seed;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}const total=proteins.length*vegetables.length;const order=Array.from({length:total},(_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}const leap=year%4===0&&(year%100!==0||year%400===0);const menus=order.slice(0,leap?366:365).map(k=>[k%proteins.length,Math.floor(k/proteins.length)%vegetables.length]);annualMenuCache.set(year,menus);return menus}function pack(d){const year=d.getFullYear();const day=Math.floor((Date.UTC(year,d.getMonth(),d.getDate())-Date.UTC(year,0,1))/86400000);const [p,v]=annualMenus(year)[day];return [proteins[p],vegetables[v]]}function fmt(d){return `${d.getMonth()+1}月${d.getDate()}日 <small>星期${weekdays[d.getDay()]}</small>`}
function render(){document.getElementById('dateText').innerHTML=fmt(selected);const items=pack(selected),types=['荤菜 · 儿子喜欢','青菜 · 妈妈喜欢'],colors=['','green'];document.getElementById('menu').innerHTML=items.map((x,i)=>`<article class="card"><div class="food-art ${colors[i]}"><span class="meal-tag">${types[i]}</span><span class="emoji">${x[1]}</span></div><div class="card-body"><h3 class="card-title">${x[0]}</h3><p class="card-desc">${i===0?'私房家常推荐':'青菜搭配'} · 约 ${x[5]} 分钟</p><div class="card-footer"><span class="time">◷ ${x[5]} 分钟</span><button class="detail-btn" data-index="${i}">看做法 <span>→</span></button></div></div></article>`).join('');document.querySelectorAll('.detail-btn').forEach(b=>b.onclick=()=>showRecipe(items[+b.dataset.index],+b.dataset.index));renderWeek()}
function renderWeek(){const start=new Date(selected);start.setDate(start.getDate()-start.getDay());document.getElementById('week').innerHTML=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const m=pack(d);return `<div class="day ${d.toDateString()===selected.toDateString()?'active':''}" data-day="${i}"><div class="day-name">${weekdays[i]} · ${d.getDate()}</div><div class="day-icon">${m[0][1]}</div><div class="day-food">${m[0][0]}</div></div>`}).join('');document.querySelectorAll('.day').forEach((el,i)=>el.onclick=()=>{selected=new Date(start);selected.setDate(start.getDate()+i);render()})}

function showRecipe(x,i){const labels=['荤菜 · 肉类蛋白','素菜 · 新鲜蔬菜'];const videos=dishVideoCatalog[x[0]]||[];let index=0;document.getElementById('mCategory').textContent=labels[i];document.getElementById('mTitle').textContent=x[0];document.getElementById('mMeta').textContent=`⏱ 约 ${x[5]} 分钟 · 食材用量按家中人数调整`;document.getElementById('mIngredients').innerHTML=x[2].split('、').map(y=>`<span class="ingredient">${y}</span>`).join('');document.getElementById('mSteps').innerHTML=x.slice(3,5).map(y=>`<li>${y}</li>`).join('');const videoWrap=document.getElementById('videoWrap');function renderVideo(){if(!videos.length){videoWrap.innerHTML='<div class="embed-box"><p class="embed-label">本菜做法视频</p><p class="embed-help">这道菜的匹配视频还在整理中，暂不显示其他菜的视频。</p></div>';return}const video=videos[index];videoWrap.innerHTML=`<div class="embed-box"><div class="video-heading"><div><p class="embed-label">${x[0]} · 抖音做法视频</p><p class="embed-help">只显示本菜视频 · ${index+1}/${videos.length}</p></div>${videos.length>1?'<button class="today-btn" id="swapVideos">换一换 ↻</button>':''}</div><div class="embed-video-grid"><article class="embed-video-card"><iframe src="https://open.douyin.com/player/video?vid=${video[1]}&autoplay=0&controls=1" loading="lazy" scrolling="no" allow="fullscreen; autoplay" referrerpolicy="unsafe-url" allowfullscreen title="${video[0]}"></iframe><div class="embed-video-info"><strong>${video[0]}</strong><span>${video[2]}</span></div></article></div></div>`;const swap=document.getElementById('swapVideos');if(swap)swap.onclick=()=>{index=(index+1)%videos.length;renderVideo()}}renderVideo();document.getElementById('modal').classList.add('show')}
